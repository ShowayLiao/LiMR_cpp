<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiMR 实时缺陷检测 WebUI</title>
    <style>
        :root { --bg-color: #1e1e1e; --sidebar-bg: #252526; --text-color: #cccccc; --accent-color: #007acc; --border-color: #3e3e42; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar h2 { font-size: 1.2rem; color: #fff; margin-bottom: 20px; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
        .form-group input, .form-group select { width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background-color: #005f9e; }
        .btn.stop { background-color: #d9534f; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.5rem; color: #fff; }
        .status-badge { margin-left: 15px; padding: 5px 10px; background: #2d2d2d; border-radius: 4px; font-size: 0.8rem; border: 1px solid #444; }
        .status-badge.active { color: #4caf50; border-color: #4caf50; }
        .monitor-panel { flex: 1; background: #000; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .monitor-panel img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .overlay-text { position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.5); font-size: 0.8rem; }
        .dashboard { display: flex; gap: 20px; margin-top: 20px; height: 100px; }
        .card { flex: 1; background: var(--sidebar-bg); border-radius: 6px; padding: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; }
        .card-title { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        .card-value { font-size: 1.8rem; color: #fff; font-weight: bold; }
        .card-value small { font-size: 1rem; color: #666; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🛠️ 参数配置</h2>
        <form id="configForm">
            <div class="form-group">
                <label>视频路径 (Video Source)</label>
                <input type="text" name="videoSource" value="../../input/blade.avi">
            </div>
            <div class="form-group">
                <label>学生模型 (Student Engine)</label>
                <input type="text" name="stuPath" value="../../input/LiMR_student_16.engine">
            </div>
             <div class="form-group">
                <label>教师模型 (Teacher Engine)</label>
                <input type="text" name="teaPath" value="../../input/LiMR_teacher_16.engine">
            </div>
            <div class="form-group">
                <label>输入尺寸 (Resize)</label>
                <input type="number" name="size" value="256" disabled title="暂未开放">
            </div>
            <button type="button" class="btn" onclick="startInference()">🚀 加载 / 重载模型</button>
            <button type="button" class="btn stop" onclick="stopInference()">⏹️ 停止检测</button>
        </form>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>🔍 LiMR 实时缺陷检测 WebUI</h1>
            <div id="statusIndicator" class="status-badge">STANDBY</div>
        </div>
        <div class="monitor-panel">
            <div class="overlay-text">Raw Frame | Heatmap Result</div>
            <img id="videoStream" src="" alt="等待启动..." style="display:none;">
        </div>
        <div class="dashboard">
            <div class="card">
                <div class="card-title">当前 FPS</div>
                <div class="card-value" id="val_fps">0.0</div>
            </div>
            <div class="card">
                <div class="card-title">推理耗时</div>
                <div class="card-value" id="val_time">0 <small>ms</small></div>
            </div>
            <div class="card">
                <div class="card-title">异常分数 (Anomaly)</div>
                <div class="card-value" id="val_score" style="color: #4caf50;">0.000</div>
            </div>
        </div>
    </div>

    <script>
        setInterval(() => {
            fetch('/api/stats').then(r => r.json()).then(data => {
                document.getElementById('val_fps').innerText = data.fps.toFixed(1);
                document.getElementById('val_time').innerHTML = data.time + ' <small>ms</small>';
                const scoreEl = document.getElementById('val_score');
                scoreEl.innerText = data.score.toFixed(4);
                scoreEl.style.color = data.score > 0.5 ? '#f44336' : '#4caf50'; 
            });
        }, 500);

        function startInference() {
            const form = document.getElementById('configForm');
            const formData = new FormData(form);
            const params = new URLSearchParams(formData);
            document.getElementById('statusIndicator').innerText = "LOADING...";
            
            fetch('/api/start', {
                method: 'POST',
                body: params
            }).then(response => {
                if (response.ok) {
                    document.getElementById('statusIndicator').innerText = "RUNNING";
                    document.getElementById('statusIndicator').classList.add('active');
                    const img = document.getElementById('videoStream');
                    img.src = "/video?" + new Date().getTime(); 
                    img.style.display = "block";
                } else {
                    alert("启动失败，请检查控制台日志");
                }
            });
        }

        function stopInference() {
            fetch('/api/stop').then(() => {
                document.getElementById('statusIndicator').innerText = "STOPPED";
                document.getElementById('statusIndicator').classList.remove('active');
            });
        }
    </script>
</body>
</html>
